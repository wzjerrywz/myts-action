name: mixed--npm

on:
  workflow_dispatch:
    inputs:
      ##################  checkout ##########################  
      branch-name:
        description: '1@checkout. 仓库'
        required: true
        default: 'gitee/react-web'
      ##################  nodejs ##########################  
      nvm-version:
        description: '2@nodejs. nvm 版本'
        required: true
        type: string
        default: '0.39.3'
      nodejs-version:
        description: '2@nodejs. nodejs 版本'
        required: true
        type: string
        default: '16.14.2'
      ##################  npm ##########################  
      project-path:
        description: '3@npm. 项目路径'
        required: true
        type: string
        default: './react-web'
      build-command:
        description: '3@npm. 构建命令'
        required: true
        type: string
        default: 'build'
      speed-origin:
        description: '3@npm. 加速镜像源'
        required: true
        type: choice
        default: 'taobao'
        options:
          - npm
          - yarn
          - tencent
          - cnpm
          - taobao
          - npmMirror
          - huawei
          - company1
          - company2
          - company3
      npm-version:
        description: '3@npm. npm 版本'
        required: true
        type: string
        default: '8.4.1'   
      nrm-version:
        description: '3@npm. nrm 版本'
        required: true
        type: string
        default: '1.2.5'               

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: step1.自定义 [build-checkout] 插件
        id: checkout
        uses: wzjerrywz/github-actions/build-checkout@v1.16.1021
        with:
          branch-name: ${{ inputs.branch-name }}
          token: ${{ inputs.token }}
          owner: ${{ inputs.owner }}
          project-name: ${{ inputs.project-name }}

      - name: step2.自定义 [setup-nodejs] 插件
        id: nodejs
        uses: wzjerrywz/github-actions/setup-nodejs@v1.16.1021
        with:
          nvm-version: ${{ inputs.nvm-version }}
          nodejs-version: ${{ inputs.nodejs-version }}

      - name: step3.自定义 [build-npm] 插件
        id: npm
        uses: wzjerrywz/github-actions/build-npm@v1.16.1021
        with:
          project-path: ${{ inputs.project-path }}
          build-command: ${{ inputs.build-command }}
          npm-version: ${{ inputs.npm-version }}
          nrm-version: ${{ inputs.nrm-version }}
          nrm-speed: ${{ inputs.speed-origin }}
