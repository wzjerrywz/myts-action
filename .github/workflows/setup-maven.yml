name: setup--maven

on:
  workflow_dispatch:
    inputs:
      maven-version:
        description: 'maven 版本'
        required: true
        type: choice
        default: 3.9.9
        options:
          - 3.9.9
          - 3.8.6
          - 3.6.3
          - 3.5.2
          - 3.3.3
          - 3.2.1
          - 3.1.0
          - 3.0.4
      install-path:
        description: 'maven 安装路径'
        required: true
        default: './soft/maven'           

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 自定义 [ setup-maven ] 插件 +++
        id: maven
        uses: wzjerrywz/github-actions/setup-maven@main
        with:
          maven-version: ${{ inputs.maven-version }}
          install-path: ${{ inputs.install-path }}


