name: build--nuget

on:
  workflow_dispatch:
    inputs:
      mono-version:
        description: 'mono 版本'
        required: true
        type: choice
        default: 6.12.0.199
        options:
          - 6.12.0.199
          - 6.10.0.104
          - 6.8.0.123
          - 6.6.0.166
          - 6.4.0.198
          - 6.0.0.344
      nuget-version:
        description: 'nuget 版本'
        required: true
        default: 6.13.2
        type: choice
        options:
          - 6.13.2
          - 6.12.4
          - 6.11.1
          - 6.10.2
          - 6.9.1
          - 6.8.1
          - 6.7.1
          - 6.6.2
          - 6.5.1
          - 6.4.3
          - 6.3.4
          - 6.2.4
          - 6.1.0
          - 6.0.6

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: step1. 使用自定义 [ setup-mono ]  插件
        id: mono
        uses: wzjerrywz/github-actions/setup-mono@main
        with:
          mono-version: ${{ inputs.mono-version }}
      - name: step2. 使用自定义 [ build-nuget ]  插件
        id: nuget
        uses: wzjerrywz/github-actions/build-nuget@main
        with:
          nuget-version: ${{ inputs.nuget-version }}



          



    

