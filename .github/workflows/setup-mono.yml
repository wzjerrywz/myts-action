name: setup--mono

on:
  workflow_dispatch:
    inputs:
      mono-version:
        description: 'mono 版本'
        required: true
        type: choice
        default: 6.12.0.199
        options:
          - 6.12.0.199
          - 6.10.0.104
          - 6.8.0.123
          - 6.6.0.166
          - 6.4.0.198
          - 6.0.0.344
          
            

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - name: 自定义 [ setup-mono ] 插件 ++--
        id: mono
        uses: wzjerrywz/github-actions/setup-mono@main
        with:
          mono-version: ${{ inputs.mono-version }}

