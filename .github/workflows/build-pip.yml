name: build--pip

on:
  workflow_dispatch:
    inputs:
      conda-version:
        description: '1@python/conda 版本'
        required: false
        type: string
        default: 'py39_25.3.1-1'
      python-version:
        description: '1@python/python 版本'
        required: false
        type: string
        default: '3.12.6'
      virtual-env:
        description: '1@python/虚拟环境名称'
        required: false
        type: string
        default: 'virenv'
      pip-version:
        description: '2@pip/pip 版本'
        required: false
        type: string
        default: '23.1.0'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 使用 自定义 【 setup-python 】 插件
        id: python
        uses: wzjerrywz/github-actions/setup-python@main
        with:
          conda-version: '23.1.0'
          python-version: '3.10'
          virtual-env: 'virenv'

      - name: 使用 自定义 【 build-pip 】 插件
        uses: wzjerrywz/github-actions/build-pip@main
        with:
          virtual-env: ${{ steps.python.outputs.virtual-env }}
          pip-version: ${{ inputs.pip-version }}
   


          



    

