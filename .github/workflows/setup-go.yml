name: setup--go

on:
  workflow_dispatch:
    inputs:
      go-version:
        description: 'go 版本'
        required: true
        type: choice
        default: '1.24.4'
        options:
          - 1.24.4
          - 1.23.5
          - 1.22.6
          - 1.21.7
          - 1.20.8
      install-path:
        description: '安装路径'
        required: true
        default: './soft/go'           

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 自定义 [ setup-go ] 插件
        id: go
        uses: wzjerrywz/github-actions/setup-go@main
        with:
          go-version: ${{ inputs.go-version }}
          install-path: ${{ inputs.install-path }}
