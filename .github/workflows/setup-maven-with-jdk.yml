name: setup--maven--with--jdk

on:
  workflow_dispatch:
    inputs:
      maven-version:
        description: 'maven 版本'
        required: true
        type: choice
        default: 3.9.9
        options:
          - 3.9.9
          - 3.8.6
          - 3.6.3
          - 3.5.2
          - 3.3.3
          - 3.2.1
          - 3.1.0
          - 3.0.4
      install-path:
        description: 'maven 安装路径'
        required: true
        default: './soft/maven'           

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
 
      - name: 自定义 [ setup-jdk ] 插件 1
        id: openjdk
        uses: wzjerrywz/github-actions/setup-openjdk@main
        with:
          jdk-version: 20.0.2
          install-path: './soft/openjdk'
     
      - name: 自定义 [ setup-maven ] 插件 2
        id: maven
        uses: wzjerrywz/github-actions/setup-maven@main
        with:
          maven-version: ${{ inputs.maven-version }}
          install-path: ${{ inputs.install-path }}

      - name: 打印 3
        run: |
          java --version   
          mvn -v


