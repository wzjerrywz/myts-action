name: build--npm

on:
  workflow_dispatch:
    inputs:
      repository:
        description: '仓库地址'
        required: true
        default: 'https://github.com/fix/test.git'
      ref-type:
        description: '引用类型'
        required: true
        type: choice
        default: branch
        options:
          - branch
          - commitId
          - tag
      ref-value:
        description: '引用值'
        required: true
        default: dev
      target-path:
        description: '目标路径'
        required: false
        default: ./     
      recurse-submodules:
        description: '是否克隆子模块'
        required: false
        default: false
        type: boolean
      custom-depth:
        description: '克隆深度'
        required: false
        default: 2
        type: number      
      enable-lfs:
        description: '是否启用LFS'
        required: false
        default: false
        type: boolean          

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 使用 nodejs 16
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      - name: 安装 npm
        run: npm install -g npm@${{ inputs.npm-version }}
      - name: 使用自定义 [ build-npm ]  插件
        id: meact
        uses: wzjerrywz/github-actions/build-npm@main
        with:
          npm-version: ${{ inputs.npm-version }}
          build-command: 'build'
          project-path: './'
          nrm-version: '1.4'
          nrm-speed: 'taobao'


          



    

