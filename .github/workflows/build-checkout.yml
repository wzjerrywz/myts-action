name: build--checkout

on:
  workflow_dispatch:
    inputs:
      git-version:
        description: 'git 版本'
        required: false
        type: string
        default: '1:2.43.0-1ubuntu7.2'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 使用自定义 Action
        id: meact
        uses: wzjerrywz/github-actions/build-checkout@v1.6.1001
        with:
          git-version: ${{ inputs.git-version }}

