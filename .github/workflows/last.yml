# .github/workflows/use-my-action.yml
name: Use My TypeScript Action


on:
  workflow_dispatch:
    inputs:
      source-directory:
        description: 'Directory containing files to process'
        required: true
      debug-mode:
        description: 'Directory containing files to process'
        required: true
        type: boolean

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: 使用自定义 Action
        id: meact
        uses: wzjerrywz/meact@v0.0.1
        with:
          hello-world: ${{ inputs.source-directory }}
      
